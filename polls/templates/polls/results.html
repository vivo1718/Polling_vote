<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Poll Results</title>
<!-- REMOVE THIS BLOCKING LINE -->
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h2 class="text-2xl font-bold text-slate-800 mb-2 text-center">{{ question }}</h2>
        <p class="text-sm text-slate-500 text-center mb-6">Total Votes: {{ total_votes }}</p>
        
        <div class="space-y-5">
            {% for item in results %}
            <div>
                <div class="flex justify-between font-medium text-slate-700 mb-2">
                    <span>{{ item.text }} ({{ item.votes }} votes)</span>
                    <span class="text-indigo-600 font-bold">{{ item.percentage }}%</span>
                </div>
                <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden">
                    <div class="bg-indigo-600 h-full rounded-full transition-all duration-500" style="width: {{ item.percentage }}%"></div>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <a href="{% url 'poll_view' %}" class="block text-center mt-8 text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-all">
            ← Back to voting
        </a>
    </div>
</body>
</html>
