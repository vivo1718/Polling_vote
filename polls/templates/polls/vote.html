<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Poll</title>
<!-- REMOVE THIS BLOCKING LINE -->
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">{{ poll.question }}</h2>
        <form action="{% url 'vote_submit' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            {% for key, value in poll.options.items %}
            <label class="flex items-center p-4 border border-slate-200 rounded-xl cursor-pointer hover:bg-indigo-50/50 hover:border-indigo-300 transition-all">
                <input type="radio" name="choice" value="{{ key }}" required class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-slate-300">
                <span class="ml-3 font-medium text-slate-700 text-lg">{{ value.text }}</span>
            </label>
            {% endfor %}
            <button type="submit" class="w-full mt-2 bg-indigo-600 text-white font-semibold py-3 px-6 rounded-xl hover:bg-indigo-700 transition-all shadow-md shadow-indigo-200">
                Submit Vote
            </button>
        </form>
    </div>
</body>
</html>
